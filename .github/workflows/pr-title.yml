name: pr-title

# Pull requests are squash-merged, so the title becomes the commit subject.
# pull_request_target is safe here: no code is checked out or executed, and fork pull requests get a token that can label.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            style
            ci
            build
            perf
          requireScope: false

  # Labels the pull request from its title type (rules in .github/release-drafter.yml); the labels drive the draft
  # release. The only job here with a write scope: it reads the title from the event payload and checks out nothing.
  # The config is read from the base branch, so a pull request cannot change the rules that label it.
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
