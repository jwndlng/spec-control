name: release

# Publishing the draft release (draft-release.yml) builds the single binary from its tag on each platform, verifies it
# and attaches it with SHA256SUMS and build-provenance attestations; the `desktop` job wraps the darwin-arm64 binary in
# the macOS app, ad-hoc signed and not notarised (no Apple account, no secrets). A draft, or a tag that does not start
# with `v`, builds nothing. The build jobs are read-only; only the publish job, which checks out nothing, holds write
# scopes.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.draft && startsWith(github.event.release.tag_name, 'v') }}
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          # GitHub's last Intel macOS image. When it is retired, build this one on macos-latest with
          # `--target=bun-darwin-x64` and run the smoke test under Rosetta.
          - runner: macos-15-intel
            platform: darwin-x64
    env:
      TAG: ${{ github.event.release.tag_name }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build single binary
        run: SPEC_CONTROL_VERSION="$TAG" bun run build

      # Every binary is executed before anything is attached; the version must be exactly the tag.
      - name: Smoke test binary
        run: |
          ./dist/spec-control --help
          version="$(./dist/spec-control --version)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::--version printed '$version', expected '$TAG'"
            exit 1
          fi

      - name: Name the binary
        run: mv dist/spec-control "dist/spec-control-$TAG-$PLATFORM"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-control-${{ matrix.platform }}
          path: dist/spec-control-${{ github.event.release.tag_name }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  # The macOS app (openspec/specs/desktop-app), Apple silicon only: Electrobun 2 builds no Intel app. It bundles the
  # darwin-arm64 binary the build job verified and is ad-hoc signed (desktop/scripts/adhoc-sign.ts), not notarised,
  # like the macOS binaries; its signature and bundled version are checked before anything is attached.
  desktop:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spec-control-darwin-arm64
          path: dist

      - name: Use the verified binary
        run: |
          mv "dist/spec-control-$TAG-darwin-arm64" dist/spec-control
          chmod +x dist/spec-control

      - name: Build the app
        working-directory: desktop
        env:
          SPEC_CONTROL_VERSION: ${{ github.event.release.tag_name }}
        run: |
          bun install --frozen-lockfile
          bun run build

      # The binary inside the app in the disk image must be the tag's, and the app's ad-hoc signature must verify.
      - name: Smoke test the app
        run: |
          dmg="$(find desktop/artifacts -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "$dmg" ]; then
            echo "::error::no .dmg under desktop/artifacts"
            exit 1
          fi
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mount/Spec Control.app"
          # The installer layout desktop/scripts/style-dmg.ts made: the Applications link, the background and Finder's layout file.
          styled=true
          if [ "$(readlink "$mount/Applications")" != "/Applications" ]; then
            echo "::error::the disk image has no Applications link"
            styled=false
          fi
          for file in .background/background.tiff .DS_Store; do
            if [ ! -f "$mount/$file" ]; then
              echo "::error::the disk image has no $file, so it is not laid out as an installer window"
              styled=false
            fi
          done
          # The app in the image is Electrobun's self-extracting wrapper: the app with the bundled binary is the zstd
          # tarball in its Resources. Bun unpacks it, since macOS's tar needs a zstd program the runner may not have.
          payload="$(find "$mount/Spec Control.app/Contents/Resources" -maxdepth 1 -name '*.tar.zst' | head -n 1)"
          unpacked="$RUNNER_TEMP/app"
          mkdir -p "$unpacked"
          if [ -n "$payload" ]; then
            PAYLOAD="$payload" bun -e 'await Bun.write(Bun.stdout, Bun.zstdDecompressSync(await Bun.file(process.env.PAYLOAD).bytes()))' | tar -x -C "$unpacked"
          fi
          hdiutil detach "$mount"
          if [ "$styled" != true ]; then
            exit 1
          fi
          bundled="$(find "$unpacked" -type f -path '*/bin/spec-control' | head -n 1)"
          if [ -z "$bundled" ]; then
            echo "::error::the app in the disk image bundles no spec-control binary"
            exit 1
          fi
          version="$("$bundled" --version)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::the bundled binary printed '$version', expected '$TAG'"
            exit 1
          fi
          mkdir -p release
          cp "$dmg" "release/Spec-Control-$TAG-darwin-arm64.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-control-desktop-darwin-arm64
          path: release/Spec-Control-${{ github.event.release.tag_name }}-darwin-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  # Runs only when every platform built and verified, so a failure attaches nothing.
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: spec-control-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          test "$(ls spec-control-* | wc -l)" -eq 4
          test "$(ls Spec-Control-*.dmg | wc -l)" -eq 1
          sha256sum spec-control-* Spec-Control-*.dmg > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/spec-control-*
            release/Spec-Control-*.dmg

      - name: Attach to the release
        run: gh release upload "$TAG" release/spec-control-* release/Spec-Control-*.dmg release/SHA256SUMS --repo "$REPO" --clobber

      # Skipped when the notes already have the section, so re-running the job does not add it twice.
      - name: Append download instructions to the release notes
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > notes.md
          if grep -q '^## Download' notes.md; then
            echo "release notes already have a Download section"
            exit 0
          fi
          cat >> notes.md <<'NOTES'

          ## Download

          The macOS app, for Apple silicon Macs: open `Spec-Control-__TAG__-darwin-arm64.dmg` and drag Spec Control to
          Applications. Like the binaries it is not notarised, so macOS refuses the first open; allow it once with
          `xattr -dr com.apple.quarantine "/Applications/Spec Control.app"`, or with **Open Anyway** in System Settings →
          Privacy & Security. To update it later, download the new `.dmg` from the releases page.

          Single binaries, no Bun needed (Intel Macs use `darwin-x64`):

          - `spec-control-__TAG__-darwin-arm64` (macOS, Apple silicon)
          - `spec-control-__TAG__-darwin-x64` (macOS, Intel)
          - `spec-control-__TAG__-linux-x64`
          - `spec-control-__TAG__-linux-arm64`

          Verify a download, then make it executable:

          ```sh
          shasum -a 256 -c --ignore-missing SHA256SUMS
          gh attestation verify spec-control-__TAG__-<platform> --repo __REPO__
          gh attestation verify Spec-Control-__TAG__-darwin-arm64.dmg --repo __REPO__
          chmod +x spec-control-__TAG__-<platform>
          ```

          The macOS binaries are not notarised either. If macOS refuses to open one, remove the quarantine flag:
          `xattr -d com.apple.quarantine spec-control-__TAG__-<platform>`
          NOTES
          sed -i -e "s|__TAG__|$TAG|g" -e "s|__REPO__|$REPO|g" notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
