name: draft-release

# Keeps one draft GitHub release current: merged pull requests grouped by their labels, the next version resolved from
# them (.github/release-drafter.yml). Never publishes, tags or builds; publishing the draft runs release.yml.
on:
  push:
    branches: [main]

# Two merges in a row must not race on the same draft.
concurrency:
  group: draft-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
